services:
  # --- Servicio de Base de Datos (MariaDB) ---
  db:
    image: mariadb:10.11
    container_name: biometrico_db
    restart: always
    environment:
      TZ: America/Guatemala
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD} # Contraseña root desde .env
      MYSQL_DATABASE: ${DB_NAME} # <-- MANEJADO DESDE .env
      MYSQL_USER: ${DB_USER} # <-- MANEJADO DESDE .env
      MYSQL_PASSWORD: ${DB_PASSWORD} # Contraseña leída desde .env
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Hospital.sql:/docker-entrypoint-initdb.d/Hospital.sql
    networks:
      - sigsa-net
    #expose:
    #  - '3306'
    ports:
      - "3308:3306"
    healthcheck:
      # <-- AÑADIDO: Chequeo de salud
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  # --- NUEVO: Servicio Sidecar para Backups Automáticos ---
  db_backup:
    image: fradelg/mysql-cron-backup:latest
    container_name: biometrico_db_backup
    restart: always
    depends_on:
      db:
        condition: service_healthy # Espera a que MariaDB esté lista
    environment:
      TZ: America/Guatemala
      # Conexión apuntando al servicio de arriba a través de la red interna
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASS: ${DB_ROOT_PASSWORD}
      # Puedes especificar 'sigsa_db' o dejarlo vacío para respaldar todas las BDs
      MYSQL_DATABASE: ${DB_NAME}
      # Programación en formato CRON (Ej: Todos los días a las 02:00 AM)
      CRON_TIME: "0 2 * * *"
      # Parámetros para un dump seguro en producción
      MYSQLDUMP_OPTS: "--single-transaction --quick --lock-tables=false"
      # Retención: Borra automáticamente archivos más viejos de 2 semanas
      MAX_BACKUPS: 14
      # Formato del nombre del archivo resultante
      BACKUP_SUFFIX: _asistencia_db
    volumes:
      # Carpeta local en el host donde se guardarán los archivos .sql.gz
      - ./backups:/backup
    networks:
      - sigsa-net
  # --- Servicio Backend (Node.js) ---
  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      TZ: America/Guatemala
      # --- Variables de Keycloak ---
      KEYCLOAK_AUTH_SERVER_URL: https://sso.hro.gob.gt
      KEYCLOAK_REALM: "Hospital-O"
      # KEYCLOAK_CLIENT_ID: 'tu-client-id-backend'
      # KEYCLOAK_SECRET: 'tu-client-secret'

      # --- Variables de Base de Datos ---
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
    env_file:
      - ./.env
    expose:
      - "3000"

    networks:
      - sigsa-net

  # --- Servicio de migraciones (Liquibase) ---
  liquibase:
    build:
      context: ./db
      dockerfile: liquibase/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Guatemala
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c", "sleep 5 && /liquibase/docker-entrypoint.sh --search-path=/liquibase/migrations --changeLogFile=db.changelog-master.yaml --url=jdbc:mariadb://db:3306/${DB_NAME} --username=${DB_USER} --password=${DB_PASSWORD} --driver=org.mariadb.jdbc.Driver update"]
    networks:
      - sigsa-net

  # --- Servicio Frontend (Angular + Nginx Proxy) ---
  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "8020:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sigsa-net
    depends_on:
      - backend
    environment:
      TZ: America/Guatemala
      API_BASE: ${FRONTEND_API_BASE}
      KEYCLOAK_URL: ${FRONTEND_KEYCLOAK_URL}
      KEYCLOAK_REALM: ${FRONTEND_KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${FRONTEND_KEYCLOAK_CLIENT_ID}

networks:
  sigsa-net:
    driver: bridge

# --- Definición de Volúmenes ---
volumes:
  mariadb_data:
    driver: local
  backups:
    driver: local
